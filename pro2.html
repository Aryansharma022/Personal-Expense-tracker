<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense</title>

<link rel="stylesheet" href="pro2.css">

</head>

<body>

<div class="container">

<h1>➕ Add New Expense</h1>

<form id="expenseForm">

<div class="input-box">

<label>Expense Name</label>

<input
type="text"
id="name"
placeholder="Enter Expense Name">

</div>

<div class="input-box">

<label>Category</label>

<select id="category">

<option>Food 🍔</option>

<option>Travel ✈</option>

<option>Shopping 🛍</option>

<option>Medical 🏥</option>

<option>Education 📚</option>

<option>Bills 💡</option>

<option>Entertainment 🎮</option>

<option>Investment 📈</option>

<option>Others 📦</option>

</select>

</div>

<div class="input-box">

<label>Amount (₹)</label>

<input
type="number"
id="amount"
placeholder="Enter Amount">

</div>

<div class="input-box">

<label>Date</label>

<input
type="date"
id="date">

</div>

<div class="input-box">

<label>Payment Method</label>

<select id="payment">

<option>Cash</option>

<option>UPI</option>

<option>Debit Card</option>

<option>Credit Card</option>

<option>Net Banking</option>

</select>

</div>

<div class="input-box">

<label>Priority</label>

<select id="priority">

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

</div>

<div class="input-box">

<label>Notes</label>

<textarea
id="notes"
rows="4"
placeholder="Write notes here...">

</textarea>

</div>

<div class="input-box">

<label>Upload Receipt</label>

<input
type="file"
id="receipt">

</div>

<div class="buttons">

<button
type="button"
class="save"
onclick="addExpense()">

💾 Save Expense

</button>

<button
type="reset"
class="reset">

🔄 Reset

</button>

</div>

<div class="buttons">

<a href="pro1.html">

<button
type="button"
class="back">

🏠 Dashboard

</button>

</a>

<a href="pro3.html">

<button
type="button"
class="history">

📋 History

</button>

</a>

</div>

</form>

</div>

<script src="pro2.js"></script>

</body>

</html>
