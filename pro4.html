<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Reports</title>
<link rel="icon" href="logo.jpeg">

<link rel="stylesheet" href="pro4.css">

</head>

<body>

<div class="container">

<h1>📊 Expense Reports</h1>

<div class="cards">

<div class="card">

<h3>Total Expense</h3>

<h2 id="totalExpense">₹0</h2>

</div>

<div class="card">

<h3>Monthly Budget</h3>

<h2 id="budget">₹0</h2>

</div>

<div class="card">

<h3>Remaining Budget</h3>

<h2 id="remaining">₹0</h2>

</div>

<div class="card">

<h3>Total Transactions</h3>

<h2 id="transactions">0</h2>

</div>

</div>

<div class="report-box">

<h2>Category Wise Expenses</h2>

<table>

<thead>

<tr>

<th>Category</th>

<th>Total Amount</th>

</tr>

</thead>

<tbody id="categoryTable">

</tbody>

</table>

</div>

<div class="progress-box">

<h2>Budget Usage</h2>

<progress
id="budgetBar"
value="0"
max="100">

</progress>

<p id="percentage"></p>

</div>

<div class="buttons">

<a href="pro1.html">

<button class="dashboard">

🏠 Dashboard

</button>

</a>

<a href="pro3.html">

<button class="history">

📋 Expense History

</button>

</a>

</div>

</div>

<script src="pro4.js"></script>

</body>

</html>
