<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <link rel="stylesheet"
          href="pro.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <img src="logo.jpeg"
                 class="logo">

            <h1>Smart Expense Tracker</h1>

            <h3>Welcome Back!</h3>

            <input 
                type="email\"
                id="email"
                placeholder="Enter Email"
               >

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

                <span
                    id="eye"
                    onclick="showPassword()">
                    👁

                </span>

            </div>

            <div class="remember">

               <label>
               <input type="checkbox" >
                     <h3>Remember me</h3> 
               </label>
                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button onclick="login()">

                Login

            </button>

            <button class="signup">

                Sign Up

            </button>

        </div>

    </div>

<script src="pro.js"></script>

</body>

</html>
